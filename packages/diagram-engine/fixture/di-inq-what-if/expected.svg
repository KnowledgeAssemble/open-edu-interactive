<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Food web for a what-if: what if the decomposer disappears</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-grass" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Grass" x="240" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="308" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Grass</text>
    <rect id="node-rabbit" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Rabbit" x="400" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="468" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Rabbit</text>
    <rect id="node-fox" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Fox" x="240" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="308" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Fox</text>
    <rect id="node-decomposer" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Decomposer" x="400" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="468" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Decomposer</text>
    <path id="grass-rabbit" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="grass feeds-on rabbit" data-oedu-relationship="feeds-on" d="M376,262.5 L400,262.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="rabbit-fox" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="rabbit feeds-on fox" data-oedu-relationship="feeds-on" d="M400,262.5 L376,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="grass-decomposer" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="grass feeds-on decomposer" data-oedu-relationship="feeds-on" d="M376,262.5 L400,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="decomposer-grass" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="decomposer produces grass" data-oedu-relationship="produces" d="M400,322.5 L376,262.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
