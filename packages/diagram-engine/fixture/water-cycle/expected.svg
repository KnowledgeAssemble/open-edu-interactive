<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Water cycle diagram: evaporation, condensation, precipitation, collection.</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-evaporation" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Evaporation" title="Liquid becomes vapour" x="610" y="270" width="60" height="60" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="640" y="300" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Evaporation</text>
    <rect id="node-condensation" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Condensation" x="370" y="510" width="60" height="60" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="400" y="540" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Condensation</text>
    <rect id="node-precipitation" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Precipitation" x="130" y="270" width="60" height="60" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="160" y="300" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Precipitation</text>
    <rect id="node-collection" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Collection" x="370" y="30" width="60" height="60" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="400" y="60" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Collection</text>
    <path id="edge-evaporation-condensation" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="evaporation leads-to condensation" data-oedu-relationship="leads-to" d="M640,330 L400,510" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-condensation-precipitation" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="condensation leads-to precipitation" data-oedu-relationship="leads-to" d="M400,510 L160,330" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-precipitation-collection" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="precipitation leads-to collection" data-oedu-relationship="leads-to" d="M160,270 L400,90" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-collection-evaporation" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="collection leads-to evaporation" data-oedu-relationship="leads-to" d="M400,90 L640,270" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
