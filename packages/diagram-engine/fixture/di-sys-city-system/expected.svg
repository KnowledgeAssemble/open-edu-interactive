<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>City metabolic system with input, waste, and recycling loop</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-food" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Food" x="160" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="228" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Food</text>
    <rect id="node-energy" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Energy" x="320" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="388" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Energy</text>
    <rect id="node-water" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Water" x="480" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="548" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Water</text>
    <rect id="node-city" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="City" x="160" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="228" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">City</text>
    <rect id="node-waste" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Waste" x="320" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="388" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Waste</text>
    <rect id="node-recycle" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Recycling loop" x="480" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="548" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Recycling loop</text>
    <path id="edge-food-city" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="food leads-to city" data-oedu-relationship="leads-to" d="M228,285 L228,300" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-energy-city" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="energy leads-to city" data-oedu-relationship="leads-to" d="M320,262.5 L296,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-water-city" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="water leads-to city" data-oedu-relationship="leads-to" d="M480,262.5 L296,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-city-waste" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="city produces waste" data-oedu-relationship="produces" d="M296,322.5 L320,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-waste-recycle" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="waste leads-to recycle" data-oedu-relationship="leads-to" d="M456,322.5 L480,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-recycle-city" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="recycle produces city" data-oedu-relationship="produces" d="M480,322.5 L296,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
