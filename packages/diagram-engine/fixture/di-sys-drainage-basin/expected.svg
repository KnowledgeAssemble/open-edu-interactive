<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Drainage basin: precipitation, runoff, groundwater, river, sea</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-precipitation" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Precipitation" x="160" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="228" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Precipitation</text>
    <rect id="node-runoff" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Runoff" x="320" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="388" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Runoff</text>
    <rect id="node-groundwater" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Groundwater" title="Storage node" x="480" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="548" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Groundwater</text>
    <rect id="node-river" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="River" x="160" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="228" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">River</text>
    <rect id="node-sea" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Sea" x="320" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="388" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Sea</text>
    <path id="edge-precipitation-runoff" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="precipitation leads-to runoff" data-oedu-relationship="leads-to" d="M296,262.5 L320,262.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-precipitation-groundwater" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="precipitation leads-to groundwater" data-oedu-relationship="leads-to" d="M296,262.5 L480,262.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-groundwater-river" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="groundwater leads-to river" data-oedu-relationship="leads-to" d="M480,262.5 L296,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-runoff-river" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="runoff leads-to river" data-oedu-relationship="leads-to" d="M320,262.5 L296,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-river-sea" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="river leads-to sea" data-oedu-relationship="leads-to" d="M296,322.5 L320,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
