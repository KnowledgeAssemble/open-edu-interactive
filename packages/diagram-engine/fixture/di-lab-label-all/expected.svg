<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Flower parts: petal, sepal, stamen, pistil</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-petal" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Petal" x="240" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="308" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Petal</text>
    <rect id="node-sepal" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Sepal" x="400" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="468" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Sepal</text>
    <rect id="node-stamen" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Stamen" x="240" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="308" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Stamen</text>
    <rect id="node-pistil" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Pistil" x="400" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="468" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Pistil</text>
    <path id="edge-petal-stamen" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="petal connected-to stamen" data-oedu-relationship="connected-to" d="M308,285 L308,300" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-sepal-petal" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="sepal connected-to petal" data-oedu-relationship="connected-to" d="M400,262.5 L376,262.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-stamen-pistil" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="stamen connected-to pistil" data-oedu-relationship="connected-to" d="M376,322.5 L400,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
