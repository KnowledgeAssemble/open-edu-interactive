<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Photosynthesis flow: sunlight, water and carbon dioxide lead to glucose and oxygen</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-sunlight" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Sunlight" x="50" y="55" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="100" y="80" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Sunlight</text>
    <rect id="node-water" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Water" x="170" y="55" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="220" y="80" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Water</text>
    <rect id="node-co2" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Carbon dioxide" x="290" y="55" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="340" y="80" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Carbon dioxide</text>
    <rect id="node-photosynthesis" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Photosynthesis" x="50" y="135" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="100" y="160" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Photosynthesis</text>
    <rect id="node-glucose" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Glucose" x="50" y="215" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="100" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Glucose</text>
    <rect id="node-oxygen" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Oxygen" x="170" y="215" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="220" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Oxygen</text>
    <path id="edge-sunlight-photosynthesis" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="sunlight leads-to photosynthesis" data-oedu-relationship="leads-to" d="M100,105 L100,135" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-water-photosynthesis" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="water leads-to photosynthesis" data-oedu-relationship="leads-to" d="M170,80 L150,160" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-co2-photosynthesis" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="co2 leads-to photosynthesis" data-oedu-relationship="leads-to" d="M290,80 L150,160" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-photosynthesis-glucose" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="photosynthesis leads-to glucose" data-oedu-relationship="leads-to" d="M100,185 L100,215" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-photosynthesis-oxygen" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="photosynthesis leads-to oxygen" data-oedu-relationship="leads-to" d="M150,160 L170,240" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
