<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Concept map: river, silt deposition, fertile soil, dense agriculture</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-river" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="River" x="240" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="308" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">River</text>
    <rect id="node-silt" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Silt deposition" x="400" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="468" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Silt deposition</text>
    <rect id="node-fertility" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Fertile soil" x="240" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="308" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Fertile soil</text>
    <rect id="node-agriculture" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Dense agriculture" x="400" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="468" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Dense agriculture</text>
    <path id="edge-river-silt" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="river leads-to silt" data-oedu-relationship="leads-to" d="M376,262.5 L400,262.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-silt-fertility" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="silt leads-to fertility" data-oedu-relationship="leads-to" d="M400,262.5 L376,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-fertility-agriculture" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="fertility influences agriculture" data-oedu-relationship="influences" d="M376,322.5 L400,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
