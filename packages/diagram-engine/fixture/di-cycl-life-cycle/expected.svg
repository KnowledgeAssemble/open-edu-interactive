<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Frog life cycle: egg, tadpole, froglet, frog</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-egg" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Egg" x="610" y="270" width="60" height="60" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="640" y="300" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Egg</text>
    <rect id="node-tadpole" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Tadpole" x="370" y="510" width="60" height="60" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="400" y="540" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Tadpole</text>
    <rect id="node-froglet" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Froglet" x="130" y="270" width="60" height="60" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="160" y="300" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Froglet</text>
    <rect id="node-frog" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Frog" x="370" y="30" width="60" height="60" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="400" y="60" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Frog</text>
    <path id="edge-egg-tadpole" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="egg leads-to tadpole" data-oedu-relationship="leads-to" d="M640,330 L400,510" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-tadpole-froglet" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="tadpole leads-to froglet" data-oedu-relationship="leads-to" d="M400,510 L160,330" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-froglet-frog" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="froglet leads-to frog" data-oedu-relationship="leads-to" d="M160,270 L400,90" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-frog-egg" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="frog leads-to egg" data-oedu-relationship="leads-to" d="M400,90 L640,270" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
