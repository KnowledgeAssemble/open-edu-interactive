<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Web of influences: climate, soil and water influence vegetation</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-climate" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Climate" x="160" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="228" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Climate</text>
    <rect id="node-soil" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Soil" x="320" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="388" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Soil</text>
    <rect id="node-water" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Water" x="480" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="548" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Water</text>
    <rect id="node-vegetation" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Vegetation" x="160" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="228" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Vegetation</text>
    <rect id="node-animals" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Animals" x="320" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="388" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Animals</text>
    <path id="edge-climate-vegetation" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="climate influences vegetation" data-oedu-relationship="influences" d="M228,285 L228,300" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-soil-vegetation" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="soil influences vegetation" data-oedu-relationship="influences" d="M320,262.5 L296,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-water-vegetation" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="water influences vegetation" data-oedu-relationship="influences" d="M480,262.5 L296,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-vegetation-animals" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="vegetation influences animals" data-oedu-relationship="influences" d="M296,322.5 L320,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
