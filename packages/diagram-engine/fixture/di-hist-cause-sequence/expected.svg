<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Causal sequence: long-term causes to trigger to outcome</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-long-cause" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Long-term causes" x="50" y="55" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="100" y="80" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Long-term causes</text>
    <rect id="node-trigger" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Trigger" x="50" y="135" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="100" y="160" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Trigger</text>
    <rect id="node-outcome" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Outcome" x="50" y="215" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="100" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Outcome</text>
    <path id="edge-long-cause-trigger" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="long-cause leads-to trigger" data-oedu-relationship="leads-to" d="M100,105 L100,135" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-trigger-outcome" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="trigger leads-to outcome" data-oedu-relationship="leads-to" d="M100,185 L100,215" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
