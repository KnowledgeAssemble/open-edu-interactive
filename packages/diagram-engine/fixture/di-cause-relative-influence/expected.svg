<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Soil and rain influence crop choice with relative strengths</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-soil" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Soil" x="240" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="308" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Soil</text>
    <rect id="node-rain" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Rain" x="400" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="468" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Rain</text>
    <rect id="node-crop" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Crop choice" x="240" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="308" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Crop choice</text>
    <path id="soil-crop" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="soil influences crop" data-oedu-relationship="influences" d="M308,285 L308,300" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="rain-crop" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="rain influences crop" data-oedu-relationship="influences" d="M400,262.5 L376,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
