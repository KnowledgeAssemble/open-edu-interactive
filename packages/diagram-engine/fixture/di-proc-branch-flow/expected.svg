<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Election flow with a junction that fans out to outcomes</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-polling" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Polling day" x="50" y="55" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="100" y="80" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Polling day</text>
    <rect id="node-counting" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Counting" x="50" y="135" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="100" y="160" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Counting</text>
    <rect id="node-win" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Winning candidate declared" x="50" y="215" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="100" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Winning candidate declared</text>
    <rect id="node-recount" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Recount requested" x="170" y="215" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="220" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Recount requested</text>
    <rect id="node-runoff" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Runoff election" x="50" y="295" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="100" y="320" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Runoff election</text>
    <path id="edge-polling-counting" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="polling leads-to counting" data-oedu-relationship="leads-to" d="M100,105 L100,135" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-counting-win" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="counting leads-to win" data-oedu-relationship="leads-to" d="M100,185 L100,215" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-counting-recount" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="counting leads-to recount" data-oedu-relationship="leads-to" d="M150,160 L170,240" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-recount-runoff" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="recount leads-to runoff" data-oedu-relationship="leads-to" d="M170,240 L150,320" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
