<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Cell: chloroplast produces glucose, mitochondria produce energy</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-chloroplast" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Chloroplast" x="240" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="308" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Chloroplast</text>
    <rect id="node-glucose" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Glucose" x="400" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="468" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Glucose</text>
    <rect id="node-mitochondria" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Mitochondria" x="240" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="308" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Mitochondria</text>
    <rect id="node-energy" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Energy" x="400" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="468" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Energy</text>
    <path id="edge-chloroplast-glucose" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="chloroplast produces glucose" data-oedu-relationship="produces" d="M376,262.5 L400,262.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-glucose-mitochondria" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="glucose feeds-on mitochondria" data-oedu-relationship="feeds-on" d="M400,262.5 L376,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-mitochondria-energy" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="mitochondria produces energy" data-oedu-relationship="produces" d="M376,322.5 L400,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
