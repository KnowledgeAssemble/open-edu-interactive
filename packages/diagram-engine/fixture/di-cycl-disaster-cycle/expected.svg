<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Disaster management cycle: mitigation, preparedness, response, recovery</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-mitigation" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Mitigation" x="610" y="270" width="60" height="60" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="640" y="300" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Mitigation</text>
    <rect id="node-preparedness" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Preparedness" x="370" y="510" width="60" height="60" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="400" y="540" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Preparedness</text>
    <rect id="node-response" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Response" x="130" y="270" width="60" height="60" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="160" y="300" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Response</text>
    <rect id="node-recovery" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Recovery" x="370" y="30" width="60" height="60" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="400" y="60" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Recovery</text>
    <path id="edge-mitigation-preparedness" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="mitigation leads-to preparedness" data-oedu-relationship="leads-to" d="M640,330 L400,510" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-preparedness-response" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="preparedness leads-to response" data-oedu-relationship="leads-to" d="M400,510 L160,330" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-response-recovery" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="response leads-to recovery" data-oedu-relationship="leads-to" d="M160,270 L400,90" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-recovery-mitigation" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="recovery leads-to mitigation" data-oedu-relationship="leads-to" d="M400,90 L640,270" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
