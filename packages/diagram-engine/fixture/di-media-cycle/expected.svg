<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Inquiry cycle: observe, question, hypothesize, test, conclude</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <g id="node-observe" data-oedu-role="selectable" data-oedu-interactive="true" data-oedu-media="slot" aria-label="Observe" data-oedu-bounds="520,207,152,152" title="Look closely at what happens">
      <rect x="520" y="207" width="152" height="152" rx="6" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
      <text x="596" y="373" text-anchor="middle" fill="currentColor" font-size="11">Observe</text>
    </g>
    <g id="node-question" data-oedu-role="selectable" data-oedu-interactive="true" data-oedu-media="slot" aria-label="Question" data-oedu-bounds="370,413,152,152" title="Ask what needs explaining">
      <rect x="370" y="413" width="152" height="152" rx="6" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
      <text x="446" y="579" text-anchor="middle" fill="currentColor" font-size="11">Question</text>
    </g>
    <g id="node-hypothesize" data-oedu-role="selectable" data-oedu-interactive="true" data-oedu-media="slot" aria-label="Hypothesize" data-oedu-bounds="128,334,152,152" title="Propose a possible answer">
      <rect x="128" y="334" width="152" height="152" rx="6" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
      <text x="204" y="500" text-anchor="middle" fill="currentColor" font-size="11">Hypothesize</text>
    </g>
    <g id="node-test" data-oedu-role="selectable" data-oedu-interactive="true" data-oedu-media="slot" aria-label="Test" data-oedu-bounds="128,80,152,152" title="Check the hypothesis against evidence">
      <rect x="128" y="80" width="152" height="152" rx="6" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
      <text x="204" y="246" text-anchor="middle" fill="currentColor" font-size="11">Test</text>
    </g>
    <g id="node-conclude" data-oedu-role="selectable" data-oedu-interactive="true" data-oedu-media="slot" aria-label="Conclude" data-oedu-bounds="370,1,152,152" title="Decide what the evidence shows">
      <rect x="370" y="1" width="152" height="152" rx="6" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
      <text x="446" y="167" text-anchor="middle" fill="currentColor" font-size="11">Conclude</text>
    </g>
    <path id="edge-observe-question" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="observe leads-to question" data-oedu-relationship="leads-to" d="M596,359 L446,413" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-question-hypothesize" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="question leads-to hypothesize" data-oedu-relationship="leads-to" d="M370,489 L280,410" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-hypothesize-test" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="hypothesize leads-to test" data-oedu-relationship="leads-to" d="M204,334 L204,232" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-test-conclude" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="test leads-to conclude" data-oedu-relationship="leads-to" d="M280,156 L370,77" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-conclude-observe" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="conclude leads-to observe" data-oedu-relationship="leads-to" d="M446,153 L596,207" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
