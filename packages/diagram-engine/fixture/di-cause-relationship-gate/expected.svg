<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Rainfall influences soil erosion (relationship hidden until answered)</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-rainfall" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Rainfall" x="240" y="270" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="308" y="292.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Rainfall</text>
    <rect id="node-erosion" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Soil erosion" x="400" y="270" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="468" y="292.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Soil erosion</text>
    <path id="rain-erodes" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="rainfall influences erosion" data-oedu-relationship="" d="M376,292.5 L400,292.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
