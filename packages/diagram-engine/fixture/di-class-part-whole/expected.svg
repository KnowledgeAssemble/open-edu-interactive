<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Parliament contains Lok Sabha and Rajya Sabha</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-parliament" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Parliament" x="50" y="55" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="100" y="80" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Parliament</text>
    <rect id="node-lok-sabha" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Lok Sabha" x="50" y="135" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="100" y="160" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Lok Sabha</text>
    <rect id="node-rajya-sabha" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Rajya Sabha" x="170" y="135" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="220" y="160" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Rajya Sabha</text>
    <rect id="node-president" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="President" x="50" y="215" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="100" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">President</text>
    <path id="edge-parliament-lok-sabha" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="parliament contains lok-sabha" data-oedu-relationship="contains" d="M100,105 L100,135" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-parliament-rajya-sabha" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="parliament contains rajya-sabha" data-oedu-relationship="contains" d="M150,80 L170,160" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-lok-sabha-president" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="lok-sabha part-of president" data-oedu-relationship="part-of" d="M100,185 L100,215" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
