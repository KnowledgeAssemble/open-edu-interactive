<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Animal classification: vertebrates and invertebrates under animals</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-animals" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Animals" x="50" y="55" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="100" y="80" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Animals</text>
    <rect id="node-vertebrates" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Vertebrates" x="50" y="135" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="100" y="160" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Vertebrates</text>
    <rect id="node-invertebrates" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Invertebrates" x="170" y="135" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="220" y="160" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Invertebrates</text>
    <rect id="node-mammals" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Mammals" x="50" y="215" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="100" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Mammals</text>
    <rect id="node-birds" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Birds" x="170" y="215" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="220" y="240" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Birds</text>
    <path id="edge-animals-vertebrates" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="animals contains vertebrates" data-oedu-relationship="contains" d="M100,105 L100,135" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-animals-invertebrates" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="animals contains invertebrates" data-oedu-relationship="contains" d="M150,80 L170,160" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-vertebrates-mammals" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="vertebrates contains mammals" data-oedu-relationship="contains" d="M100,185 L100,215" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-vertebrates-birds" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="vertebrates contains birds" data-oedu-relationship="contains" d="M150,160 L170,240" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
