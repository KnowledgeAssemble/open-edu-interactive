<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Rock cycle: magma to igneous, weathering to sedimentary, transforms to metamorphic</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-igneous" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Igneous" x="240" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="308" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Igneous</text>
    <rect id="node-sedimentary" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Sedimentary" x="400" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="468" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Sedimentary</text>
    <rect id="node-metamorphic" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Metamorphic" x="240" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="308" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Metamorphic</text>
    <rect id="node-magma" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Magma" x="400" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="468" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Magma</text>
    <path id="edge-magma-igneous" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="magma transforms-to igneous" data-oedu-relationship="transforms-to" d="M400,322.5 L376,262.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-igneous-sedimentary" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="igneous weathers-into sedimentary" data-oedu-relationship="weathers-into" d="M376,262.5 L400,262.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-sedimentary-metamorphic" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="sedimentary transforms-to metamorphic" data-oedu-relationship="transforms-to" d="M400,262.5 L376,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-metamorphic-magma" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="metamorphic transforms-to magma" data-oedu-relationship="transforms-to" d="M376,322.5 L400,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
