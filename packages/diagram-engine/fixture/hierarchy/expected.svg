<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Simple hierarchy: Root contains Child 1 and Child 2</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-root" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Root" x="50" y="55" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="100" y="80" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Root</text>
    <rect id="node-child1" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Child 1" x="50" y="135" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="100" y="160" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Child 1</text>
    <rect id="node-child2" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Child 2" x="170" y="135" width="100" height="50" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="220" y="160" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Child 2</text>
    <path id="edge-root-child1" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="root contains child1" data-oedu-relationship="contains" d="M100,105 L100,135" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-root-child2" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="root contains child2" data-oedu-relationship="contains" d="M150,80 L170,160" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
