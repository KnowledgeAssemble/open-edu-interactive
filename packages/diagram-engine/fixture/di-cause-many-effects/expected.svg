<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Concept map: effects of deforestation</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-deforest" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Deforestation" x="160" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="228" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Deforestation</text>
    <rect id="node-habitat-loss" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Habitat loss" x="320" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="388" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Habitat loss</text>
    <rect id="node-soil-erosion" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Soil erosion" x="480" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="548" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Soil erosion</text>
    <rect id="node-climate-change" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Climate change" x="160" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="228" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Climate change</text>
    <rect id="node-flooding" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Flooding" x="320" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="388" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Flooding</text>
    <path id="edge-deforest-habitat-loss" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="deforest leads-to habitat-loss" data-oedu-relationship="leads-to" d="M296,262.5 L320,262.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-deforest-soil-erosion" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="deforest leads-to soil-erosion" data-oedu-relationship="leads-to" d="M296,262.5 L480,262.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-deforest-climate-change" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="deforest influences climate-change" data-oedu-relationship="influences" d="M228,285 L228,300" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-soil-erosion-flooding" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="soil-erosion leads-to flooding" data-oedu-relationship="leads-to" d="M480,262.5 L456,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
