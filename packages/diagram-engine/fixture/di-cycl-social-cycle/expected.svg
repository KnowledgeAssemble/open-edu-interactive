<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Economic cycle: demand leads to prices leads to production returns to demand</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-demand" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Demand" x="610" y="270" width="60" height="60" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="640" y="300" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Demand</text>
    <rect id="node-prices" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Prices" x="250" y="478" width="60" height="60" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="280" y="508" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Prices</text>
    <rect id="node-production" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Production" x="250" y="62" width="60" height="60" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="280" y="92" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Production</text>
    <path id="edge-demand-prices" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="demand leads-to prices" data-oedu-relationship="leads-to" d="M610,300 L310,508" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-prices-production" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="prices leads-to production" data-oedu-relationship="leads-to" d="M280,478 L280,122" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-production-demand" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="production leads-to demand" data-oedu-relationship="leads-to" d="M310,92 L610,300" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
