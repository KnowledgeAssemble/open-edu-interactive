<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Concept map with a directed back-edge forming a cycle</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-practice" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Practice" x="240" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="308" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Practice</text>
    <rect id="node-confidence" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Confidence" x="400" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="468" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Confidence</text>
    <rect id="node-interest" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Interest" x="240" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="308" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Interest</text>
    <path id="practice-confidence" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="practice influences confidence" data-oedu-relationship="influences" d="M376,262.5 L400,262.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="confidence-interest" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="confidence influences interest" data-oedu-relationship="influences" d="M400,262.5 L376,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="interest-practice" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="interest influences practice" data-oedu-relationship="influences" d="M308,300 L308,285" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
