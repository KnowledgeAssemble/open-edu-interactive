<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Concept map: drivers of migration to cities</title>
  <desc>An interactive diagram showing structural relationships</desc>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="currentColor"/>
    </marker>
  </defs>
  <g id="diagram-root">
    <g id="diagram-nodes">
    <rect id="node-jobs" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="City jobs" x="240" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="308" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">City jobs</text>
    <rect id="node-services" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="City services" x="400" y="240" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="468" y="262.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">City services</text>
    <rect id="node-rural-stress" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Rural distress" x="240" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="308" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Rural distress</text>
    <rect id="node-migration" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="Migration to cities" x="400" y="300" width="136" height="45" rx="6" fill="currentColor" opacity="0.85" stroke="currentColor" stroke-width="1.5"/>
    <text x="468" y="322.5" text-anchor="middle" dominant-baseline="central" font-size="11" fill="white">Migration to cities</text>
    <path id="edge-jobs-migration" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="jobs influences migration" data-oedu-relationship="influences" d="M376,262.5 L400,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-services-migration" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="services influences migration" data-oedu-relationship="influences" d="M468,285 L468,300" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    <path id="edge-rural-stress-migration" data-oedu-role="selectable" data-oedu-interactive="true" aria-label="rural-stress influences migration" data-oedu-relationship="influences" d="M376,322.5 L400,322.5" marker-end="url(#arrowhead)" stroke="currentColor" stroke-width="2" fill="none"/>
    </g>
  </g>
</svg>
