<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Illustration of the Sun, Moon, and Star</title>
  <desc>Three labeled celestial entities shown together.</desc>
  <g id="visual-root">
  <g id="illustration-sun-illustration" data-oedu-role="visual">
    <g id="illustration-sun" data-oedu-role="selectable" data-oedu-interactive="true" data-oedu-media="slot" aria-label="Sun" data-oedu-bounds="40,240,220,120">
      <rect x="40" y="240" width="220" height="120" rx="6" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
      <text x="150" y="374" text-anchor="middle" fill="currentColor">Sun</text>
    </g>
    <g id="illustration-moon" data-oedu-role="selectable" data-oedu-interactive="true" data-oedu-media="slot" aria-label="Moon" data-oedu-bounds="290,240,220,120">
      <rect x="290" y="240" width="220" height="120" rx="6" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
      <text x="400" y="374" text-anchor="middle" fill="currentColor">Moon</text>
    </g>
    <g id="illustration-star" data-oedu-role="selectable" data-oedu-interactive="true" data-oedu-media="slot" aria-label="Star" data-oedu-bounds="540,240,220,120">
      <rect x="540" y="240" width="220" height="120" rx="6" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.5"/>
      <text x="650" y="374" text-anchor="middle" fill="currentColor">Star</text>
    </g>
  </g>
  </g>
</svg>
