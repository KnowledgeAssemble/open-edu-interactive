<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Map with the capital, the peak, and the western sea.</title>
  <desc>An interactive geographic map</desc>
  <g id="map-root">
    <g id="map-layers">
  <g id="geom-basemap" data-oedu-role="layer" aria-label="basemap">
    <path id="geom-basemap-region-s" data-oedu-role="region" aria-label="Region South" title="The region for this map." d="M 148 552 L 652 552 L 652 48 L 148 48 L 148 552 Z" fill="currentColor" opacity="0.3" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <g id="geom-features" data-oedu-role="layer" aria-label="features">
    <circle id="geom-features-capital" data-oedu-role="marker" data-oedu-interactive="true" aria-label="Capital City" title="The capital." cx="400" cy="350.4" r="22" fill="currentColor" opacity="0.7" stroke="currentColor" stroke-width="1.5"/>
    <circle id="geom-features-peak" data-oedu-role="marker" data-oedu-interactive="true" aria-label="Peak" title="The highest point." cx="349.6" cy="249.6" r="22" fill="currentColor" opacity="0.7" stroke="currentColor" stroke-width="1.5"/>
    <circle id="geom-features-west-sea" data-oedu-role="marker" data-oedu-interactive="true" aria-label="Western Sea" title="The western sea." cx="198.4" cy="400.8" r="22" fill="currentColor" opacity="0.7" stroke="currentColor" stroke-width="1.5"/>
  </g>
  <g id="geom-legend" data-oedu-role="legend" aria-label="Legend">
    <text id="geom-legend-item-0" data-oedu-role="legend-item" aria-label="Region" x="22" y="22" text-anchor="start" dominant-baseline="central" font-size="12">Region</text>
    <text id="geom-legend-item-1" data-oedu-role="legend-item" aria-label="Feature" x="22" y="40" text-anchor="start" dominant-baseline="central" font-size="12">Feature</text>
  </g>
  <g id="geom-scale-bar" data-oedu-role="scale-bar" aria-label="1000 KM">
    <line x1="26" y1="530" x2="269" y2="530" stroke="currentColor" stroke-width="2"/>
    <line x1="26" y1="526" x2="26" y2="534" stroke="currentColor" stroke-width="1.5"/>
    <line x1="269" y1="526" x2="269" y2="534" stroke="currentColor" stroke-width="1.5"/>
  </g>
    </g>
  </g>
</svg>
