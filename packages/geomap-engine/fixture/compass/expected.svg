<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Map with a compass showing bearings from the school</title>
  <desc>An interactive geographic map</desc>
  <g id="map-root">
    <g id="map-layers">
  <g id="geom-places" data-oedu-role="layer" aria-label="places">
    <circle id="geom-places-shrine" data-oedu-role="marker" data-oedu-interactive="true" aria-label="Shrine" cx="400" cy="48" r="22" fill="currentColor" opacity="0.7" stroke="currentColor" stroke-width="1.5"/>
    <circle id="geom-places-pond" data-oedu-role="marker" data-oedu-interactive="true" aria-label="Pond" cx="274" cy="552" r="22" fill="currentColor" opacity="0.7" stroke="currentColor" stroke-width="1.5"/>
    <circle id="geom-places-park" data-oedu-role="marker" data-oedu-interactive="true" aria-label="Park" cx="526" cy="300" r="22" fill="currentColor" opacity="0.7" stroke="currentColor" stroke-width="1.5"/>
  </g>
  <g id="geom-compass" data-oedu-role="compass" data-oedu-interactive="true" aria-label="North">
    <line x1="760" y1="8" x2="760" y2="68" stroke="currentColor" stroke-width="1.5"/>
    <line x1="730" y1="38" x2="790" y2="38" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="760" cy="38" r="2" fill="currentColor"/>
  </g>
  <g id="geom-scale-bar" data-oedu-role="scale-bar" aria-label="100 KM">
    <line x1="26" y1="530" x2="269" y2="530" stroke="currentColor" stroke-width="2"/>
    <line x1="26" y1="526" x2="26" y2="534" stroke="currentColor" stroke-width="1.5"/>
    <line x1="269" y1="526" x2="269" y2="534" stroke="currentColor" stroke-width="1.5"/>
  </g>
    </g>
  </g>
</svg>
