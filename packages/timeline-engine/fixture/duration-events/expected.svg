<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
  <title>Timeline of events with explicit duration spans</title>
  <desc>An interactive timeline visualization</desc>
  <g id="timeline-root">
    <g id="timeline-tracks">
  <line id="gridline-0" data-oedu-role="gridline" data-oedu-value="1875" x1="0" y1="0" x2="40" y2="24" stroke="currentColor" stroke-width="1"/>
  <line id="gridline-1" data-oedu-role="gridline" data-oedu-value="1900" x1="0" y1="0" x2="40" y2="24" stroke="currentColor" stroke-width="1"/>
  <line id="gridline-2" data-oedu-role="gridline" data-oedu-value="1925" x1="0" y1="0" x2="40" y2="24" stroke="currentColor" stroke-width="1"/>
  <line id="tick-0" data-oedu-role="tick" data-oedu-value="1875" data-oedu-bounds="234.9958626144626,80,2,6" x1="234.9958626144626" y1="80" x2="236.9958626144626" y2="86" stroke="currentColor" stroke-width="1"/>
  <line id="tick-1" data-oedu-role="tick" data-oedu-value="1900" data-oedu-bounds="423.88819932463264,80,2,6" x1="423.88819932463264" y1="80" x2="425.88819932463264" y2="86" stroke="currentColor" stroke-width="1"/>
  <line id="tick-2" data-oedu-role="tick" data-oedu-value="1925" data-oedu-bounds="612.7805360348027,80,2,6" x1="612.7805360348027" y1="80" x2="614.7805360348027" y2="86" stroke="currentColor" stroke-width="1"/>
  <text id="label-tick-0" data-oedu-role="label" data-oedu-value="1875" aria-label="1875" data-oedu-bounds="205.9958626144626,88,60,18" x="235.9958626144626" y="97" text-anchor="middle" dominant-baseline="central">1875</text>
  <text id="label-tick-1" data-oedu-role="label" data-oedu-value="1900" aria-label="1900" data-oedu-bounds="394.88819932463264,88,60,18" x="424.88819932463264" y="97" text-anchor="middle" dominant-baseline="central">1900</text>
  <text id="label-tick-2" data-oedu-role="label" data-oedu-value="1925" aria-label="1925" data-oedu-bounds="583.7805360348027,88,60,18" x="613.7805360348027" y="97" text-anchor="middle" dominant-baseline="central">1925</text>
  <text id="label-track-track-default" data-oedu-role="label" data-oedu-bounds="4,40,92,20" x="50" y="50" text-anchor="middle" dominant-baseline="central"></text>
  <rect id="track-track-default" data-oedu-role="track-lane" data-oedu-bounds="100,20,680,60" x="100" y="20" width="680" height="60" fill="none" stroke="currentColor" stroke-width="0.5" stroke-dasharray="4,2"/>
  <rect id="war-span" data-oedu-role="period-band" aria-label="First World War (1914 – 1918)" data-oedu-bounds="530.6604605883606,38,30.223601350734725,24" x="530.6604605883606" y="38" width="30.223601350734725" height="24" fill="currentColor" opacity="0.35" stroke="currentColor" stroke-width="1"/>
  <rect id="depression-span" data-oedu-role="period-band" aria-label="Great Depression (1929 – 1939)" data-oedu-bounds="644.0041373855374,38,75.54865991299323,24" x="644.0041373855374" y="38" width="75.54865991299323" height="24" fill="currentColor" opacity="0.35" stroke="currentColor" stroke-width="1"/>
  <rect id="independence-span" data-oedu-role="period-band" aria-label="Independence movement (1857 – 1947)" data-oedu-bounds="100,38,680,24" x="100" y="38" width="680" height="24" fill="currentColor" opacity="0.35" stroke="currentColor" stroke-width="1"/>
  <circle id="war" data-oedu-role="selectable" data-oedu-interactive="true" data-oedu-actions="select focus" aria-label="First World War (1914)" data-oedu-bounds="508.6604605883606,28,44,44" cx="530.6604605883606" cy="50" r="22" fill="currentColor" stroke="currentColor" stroke-width="2"/>
  <circle id="depression" data-oedu-role="selectable" data-oedu-interactive="true" data-oedu-actions="select focus" aria-label="Great Depression (1929)" data-oedu-bounds="622.0041373855374,28,44,44" cx="644.0041373855374" cy="50" r="22" fill="currentColor" stroke="currentColor" stroke-width="2"/>
  <circle id="independence" data-oedu-role="selectable" data-oedu-interactive="true" data-oedu-actions="select focus" aria-label="Independence movement (1857)" data-oedu-bounds="78,28,44,44" cx="100" cy="50" r="22" fill="currentColor" stroke="currentColor" stroke-width="2"/>
    </g>
  </g>
</svg>